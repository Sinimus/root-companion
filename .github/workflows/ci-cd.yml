name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Run Tests
        run: pnpm test

  # Builds the production image without pushing it and tests it in a browser,
  # on pull requests and before every deploy, so a broken Dockerfile or bundle
  # fails here instead of on the deploy after the merge
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: root-companion:ci

      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 3000:3000 root-companion:ci
          for i in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:3000/; then
              echo "Container answered on attempt ${i}"
              # the service worker is generated by the build, not tracked in git
              curl --silent --fail --output /dev/null http://localhost:3000/sw.js
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Browser test against the same running container: every page in
      # e2e/routes.json must render from the bundle without a JavaScript error
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser test the image
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke || true
          docker rm --force smoke || true

  build-and-push:
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST \
            "https://coolify.sinimus.com/api/v1/deploy?uuid=r5zbopaf9k1ovpsecui3pxw9&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "Coolify deploy API returned HTTP ${status}"
          test "${status}" -ge 200 && test "${status}" -lt 300
