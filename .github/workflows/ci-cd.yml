name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Run Tests
        run: pnpm test

  # Builds the production image on pull requests (no push), so a broken
  # Dockerfile fails here instead of on the deploy after the merge
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: root-companion:ci

      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 3000:3000 root-companion:ci
          for i in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:3000/; then
              echo "Container answered on attempt ${i}"
              docker rm --force smoke
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST \
            "https://coolify.sinimus.com/api/v1/deploy?uuid=r5zbopaf9k1ovpsecui3pxw9&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "Coolify deploy API returned HTTP ${status}"
          test "${status}" -ge 200 && test "${status}" -lt 300
